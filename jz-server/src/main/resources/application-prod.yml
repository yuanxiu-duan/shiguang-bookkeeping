spring:
  datasource:
    # 生产环境必须通过环境变量注入
    # 示例：jdbc:mysql://your-mysql-host:3306/moneykeeper?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    enabled: false

app:
  cors:
    allowed-origins: https://your-domain.com,http://your-domain.com
